<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rokkitt:ital,wght@0,100..900;1,100..900&family=Vidaloka&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
 crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
<body>
    <h1 id="head">Add Finance Details</h1>
    <div class="container">
        <form >
            <div>
            <label for="descript">Description : &nbsp;</label>
            <input type="text" id ="descript" required>
        </div>
        <div>
            <label for="amt">Amount </label>: 
            <input type="number" id ="amt" required>
        </div>
        <div>Type : 
            <select name="option" id="opt">
               <option value="Inc">Income</option>
               <option value="Exp">Expense</option>
            </select>
        </div>
        </form>
        <div class="info">
            <button class = "btn" id = "add">Add</button>
            <ul id="list">
            </ul>
            <button class = "btn" id="reset">Reset Data</button>
        </div>
        <div id = "imp-btn">
            <button type="submit"><a href="result.html">Generate Graph</a></button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
